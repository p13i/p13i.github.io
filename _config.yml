title: Pramod Kotipalli
subtitle: Software engineer and computer science researcher
url: "https://p13i.io"

# Site configurations
timezone: UTC
permalink: "/posts/:year/:month/:title/"
markdown: kramdown
sass:
  sass_dir: _sass
  style: :compressed
repository: p13i/p13i.github.io
include:
  - static
  - assets
collections:
  tweets:
    output: true
  pix:
    output: true
  bytes:
    output: true

# Dependencies
gems:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-github-metadata
  - jekyll-seo-tag
